      <p>The plan for your project is due <strong>{{assignments.project1.due.date}}</strong> as the first part of the project.</p>
      <p>As we approach the group projects, I want to provide you with some tips and reminders. These guidelines are designed to help you navigate the challenges of group work and ensure a successful project outcome.&nbsp;</p>
      <p><strong>Look over the rubric:</strong><br>It is essential that each group member looks over and understands the rubric. Since this is a group project, you will be graded as a group. Keep this in mind!</p>
      <p><strong>Dividing up group work:</strong><br>It is essential to recognize that group projects are about collaboration, meaning that no matter how hard you try to divide the work equally, there will still be within the group who end up doing more work than other members. Within group projects, each individual brings a different set of strengths to the “table,” these strengths will need to be leaned upon to complete the project and meet the rubric's requirements. Use this time to help and truly collaborate to complete the project as a team.&nbsp;</p>
      <p><strong>Group members do not communicate or take part in group planning discussions:</strong><br>If a member of your group is not actively participating in group conversations, reach out to them directly. It's important to keep everyone in the loop and engaged. Give them ample time to respond. If you don't hear back, please let me know, and I will assist in facilitating the communication.&nbsp;</p>
      <p><strong>Quality of Work:</strong><br>If a group member's work doesn't meet the project's or rubric's requirements, reaching out and offering assistance is essential. Remember, this is a team effort, and we're here to support each other. Schedule a call or email to discuss how you can help each other meet the task's requirements. If you need more time to revise your work, don't hesitate to request an extension, clearly stating the reasons for the request.&nbsp;</p>
      <p><br><strong>Extension Requests:</strong><br>Suppose a personal situation or unforeseen circumstance arises through the group project process, such as a sudden illness or a family emergency. In that case, extension requests can be granted to ensure that each member has the opportunity to submit quality work that they are proud of. An Extension request form must be submitted in case of an event like this.&nbsp;</p>
      <p>Regards,</p>
      <p>Aaron Buitenwerf</p>
  - name: "CST8288 Group Project Part 2 Database Security"
    start:
      weeks: 6
      days: 2
    end:
      weeks: 15
    content: |
      <p>Hello everyone!</p>
      <p>Part 2 of the group project is due {{assignments.project2.due.date}}.</p>
      <p>As part of this part of the project, I would like to see each group implement proper secure password storage in the database</p>
      <p>This does not require a lot of code, just a bit of understanding which I hope to provide:</p>
      <p>I am sure you have all heard on the news about database leaks and passwords being compromised. Hackers often aim to get the list of passwords from the database of websites so that they can access all the accounts. If the passwords are stored as plain-text on the database, then the hacker immediately gains access to all accounts upon stealing the data. To prevent this, databases should always store passwords as <strong>hashed</strong> strings. Here's a high level view of what hash functions are:</p>
      <p>A <strong>hash function</strong> is an often complex mathematical/cryptographic function that takes in a string of arbitrary length and outputs a fixed length string of seemingly random characters. However, the function has these special properties:</p>
      <ul>
      <li>The output hash derived from a specific input is always the same. Plain Text Password -&gt; HashFunction() -&gt; Unique Hash String</li>
      <li>The input of the function is near impossible (unfeasible) to obtain given the output hash</li>
      </ul>
      <p>So a password such as "mypassword123" will always produce the same hash output when fed through a hash function such as "a8cfcd74832004951b4408cdb0a5dbcd8c7e52d43f7fe-244bf7205805241da". These hashes of the password strings is what should be stored on the database when a user registers. Then to verify a user trying to login, we take their attempt input and put it through the same hash function and compare the output to the hash stored on the database. If they match, the user inputted the correct string.</p>
      <p>When hackers obtain lists of these hashed passwords from a leaked database, they then use a brute force or dictionary attack on the list by running guesses of the passwords through the hash function the website used and comparing to the list. If the hash function executes too quickly on modern computers, this makes it trivial for hackers to crack all the hashes. Thus, it is vital that us programmers use modern hash functions that take time to compute but not so much time that servers take forever to register a user.</p>
      <p>This means you should never use a hash function such as the deprecated MD5 hash function. Instead use modern hash functions such as SHA-256. Programmers should always use pre-built and verified packages that implement cryptographic hashing and encryption functionalities as it takes an expert in Cryptography and Mathematics to develop these functions.&nbsp;</p>
      <p>With all that said, for part 3 or 4 of the project I would like to see each group <em>storing their user passwords as hashes</em> on the database. It is very simple to do this with a package such as <strong>Bcrypt</strong>. See this tutorial for an example: <a rel="noopener" href="https://dzone.com/articles/hashing-passwords-in-java-with-bcrypt">https://dzone.com/articles/hashing-passwords-in-java-with-bcrypt</a></p>
      <p>I hope that explanation helped you understand why password storage should be treated with care and should never be stored as plain text.</p>
      <p>If you have any questions about this topic, please reach out as I am very passionate about this topic! I look forward to seeing all the improvements to your great projects in part 3! A reminder that this is due this <strong>Friday Nov 22</strong></p>
      <p>Regards,</p>
      <p>Aaron Buitenwerf</p>
